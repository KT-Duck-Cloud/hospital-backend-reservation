name: CI - reservation

# main은 최신 앱 코드로 검사한다. PR에는 배포 비밀번호나 쓰기 권한을 주지 않는다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=검사만 / harbor-login=접속만 / publish=검사 후 업로드'
        type: choice
        options: [check, harbor-login, publish]
        default: check

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SERVICE: reservation
  IMAGE_NAME: reservation-app-reservation
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY || 'cicd.ktci5.kr' }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT || 'duckcloud' }}
  # 저장된 관리자 계정과 섞이지 않게 임시 Runner 전용 로그인 경로를 사용한다.
  DOCKER_CONFIG: /tmp/duckcloud-docker-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  harbor-login:
    # VM에서 성공한 접속과 GitHub Runner에서의 접속은 별도다. 첫 실행은 이 모드로 한다.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'harbor-login' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: CI Robot 계정으로 Harbor 로그인만 확인
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HARBOR_USERNAME" && test -n "$HARBOR_PASSWORD"
          [[ "$HARBOR_REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$HARBOR_USERNAME" == 'robot$'* ]] || { echo '::error::관리자가 아닌 CI Robot 계정을 지정하세요'; exit 1; }
          install -d -m 700 "$DOCKER_CONFIG"
          # Access 로그인 화면으로 이동하면 Docker 인증으로 통과한 것으로 보지 않는다.
          code=$(curl --connect-timeout 5 --max-time 20 -sS -D "$RUNNER_TEMP/registry-headers" -o "$RUNNER_TEMP/registry-response" -w '%{http_code}' "https://$HARBOR_REGISTRY/v2/")
          [[ "$code" == 401 || "$code" == 200 ]] || { echo "::error::Registry 응답 $code. Tunnel/Access/접속 경로를 확인하세요"; exit 1; }
          # 401은 비공개 Registry의 정상 인증 요구다. 토큰 발급 주소도 외부 HTTPS여야 한다.
          # VPN IP를 반환하면 GitHub 호스티드 Runner가 접속할 수 없으므로 여기서 중단한다.
          if [[ "$code" == 401 ]]; then
            challenge=$(tr -d '\r' < "$RUNNER_TEMP/registry-headers" | grep -i '^www-authenticate:' | tail -n 1)
            realm=$(printf '%s' "$challenge" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
            [[ "$realm" == "https://$HARBOR_REGISTRY/service/token" ]] || {
              echo '::error::Harbor 인증 토큰 주소가 외부 HTTPS 주소와 다릅니다. Tunnel/Harbor 설정을 확인하세요.'
              exit 1
            }
          fi
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin
          echo 'Harbor 로그인 성공. 이미지 업로드와 배포는 실행하지 않았습니다.' >> "$GITHUB_STEP_SUMMARY"
      - name: 시험 로그인 해제
        if: always()
        run: docker logout "$HARBOR_REGISTRY" || true

  check:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'harbor-login'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 이번 실행의 앱 소스 가져오기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.12 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 개발팀이 고정한 의존성 설치
        run: python -m pip install -r requirements-dev.txt
      - name: 문법 검사 및 SQLite 기반 테스트
        # TEST_DB_URL을 주입하지 않아 운영 DB 및 재시작 시험에 접속하지 않는다.
        run: |
          python -m compileall -q app shared tests
          python -m pytest tests -q --junitxml="$RUNNER_TEMP/pytest.xml"
      - name: 소스 취약점·비밀정보 검사
        # 결과 확인용 검사: 발견 사항이나 검사 오류로 빌드·배포를 중단하지 않는다.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Dockerfile 등 설정 검사
        # 결과 확인용 검사: 발견 사항이나 검사 오류로 빌드·배포를 중단하지 않는다.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: '0'
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
      # 업로드 작업이 꺼져 있을 때와 PR에서도 실제 이미지 빌드·검사는 수행한다.
      - name: 이미지 빌드 도구 준비
        if: github.event_name == 'pull_request' || vars.CICD_PUBLISH_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: 검사 전용 이미지 빌드
        if: github.event_name == 'pull_request' || vars.CICD_PUBLISH_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --load \
            --build-arg "APP_VERSION=$GITHUB_SHA" \
            --tag "duckcloud/$IMAGE_NAME:sha-$GITHUB_SHA" .
      - name: 실제 실행 이미지 검사
        if: github.event_name == 'pull_request' || vars.CICD_PUBLISH_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')
        # 결과 확인용 검사: 발견 사항이나 검사 오류로 빌드·배포를 중단하지 않는다.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: image
          image-ref: duckcloud/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CICD_PUBLISH_ENABLED == 'true' && (github.event_name == 'push' || inputs.mode == 'publish')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      harbor-digest: ${{ steps.harbor.outputs.harbor-digest }}
    steps:
      - name: 검사한 커밋의 앱 소스 가져오기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 업로드 설정 확인
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          test -n "$HARBOR_USERNAME" && test -n "$HARBOR_PASSWORD"
          [[ "$HARBOR_USERNAME" == 'robot$'* ]] || { echo '::error::CI Robot 계정을 사용하세요'; exit 1; }
          [[ "$HARBOR_REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$HARBOR_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
      - name: 이미지 빌드 도구 준비
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: 온프레미스·AWS x86 노드 공용 이미지 빌드
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --load \
            --build-arg "APP_VERSION=$GITHUB_SHA" \
            --tag "duckcloud/$IMAGE_NAME:sha-$GITHUB_SHA" .
      - name: 업로드할 실제 이미지 검사 — 참고용
        # 결과 확인용 검사: 발견 사항이나 검사 오류로 빌드·배포를 중단하지 않는다.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: image
          image-ref: duckcloud/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Harbor CI 계정 로그인
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin
      - name: 검사한 이미지 Harbor 업로드 및 digest 확인
        id: harbor
        run: |
          set -euo pipefail
          LOCAL="duckcloud/$IMAGE_NAME:sha-$GITHUB_SHA"
          TARGET="$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:sha-$GITHUB_SHA"
          # 업로드한 이미지 내용을 비교한다. 인증 오류를 이미지 없음으로 처리하지 않는다.
          docker image inspect "$LOCAL" > "$RUNNER_TEMP/local-image.json"
          CONFIG=$(jq -er '.[0] | select(.Os == "linux" and .Architecture == "amd64") | if .Descriptor then .Descriptor.annotations["config.digest"] else .Id end | select(type == "string")' "$RUNNER_TEMP/local-image.json")
          [[ "$CONFIG" =~ ^sha256:[0-9a-f]{64}$ ]]
          REMOTE="$RUNNER_TEMP/remote-manifest.json"
          if docker manifest inspect --verbose "$TARGET" > "$REMOTE" 2> "$RUNNER_TEMP/manifest-error"; then
            echo '기존 커밋 태그의 이미지 내용을 확인합니다.'
          elif grep -Eqi 'manifest unknown|manifest_unknown|no such manifest' "$RUNNER_TEMP/manifest-error"; then
            docker tag "$LOCAL" "$TARGET"
            docker push "$TARGET"
            docker manifest inspect --verbose "$TARGET" > "$REMOTE"
          else
            echo '::error::Harbor 이미지 조회 실패. 연결·인증·권한을 확인하세요.'
            exit 1
          fi
          REMOTE_CONFIG=$(jq -er '(.SchemaV2Manifest // .OCIManifest).config.digest' "$REMOTE")
          [[ "$REMOTE_CONFIG" == "$CONFIG" ]] || { echo '::error::검사한 이미지와 Harbor 이미지가 다릅니다.'; exit 1; }
          DIGEST=$(jq -er '.Descriptor.digest' "$REMOTE")
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "harbor-digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Harbor 이미지 확인 완료: $TARGET@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Registry 로그인 해제
        if: always()
        run: |
          docker logout "$HARBOR_REGISTRY" || true

  update-gitops:
    needs: publish
    if: vars.CICD_GITOPS_UPDATE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: GitOps 저장소 전용 쓰기 토큰 발급
        id: gitops-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hospital-gitops
      - name: 배포 설정 가져오기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository_owner }}/hospital-gitops
          ref: main
          token: ${{ steps.gitops-token.outputs.token }}
      - name: 검증된 이미지 버전만 GitOps에 반영
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          # 노드의 VPN 다운로드 주소. CI 업로드 도메인과 구분한다. HTTP 선택은 노드 containerd 설정에서 한다.
          HARBOR_PULL_REGISTRY: ${{ vars.HARBOR_PULL_REGISTRY || '100.64.0.41:8086' }}
          HARBOR_DIGEST: ${{ needs.publish.outputs.harbor-digest }}
        run: |
          set -euo pipefail
          # 이 작업은 이미지 파일만 수정한다. DB·운영 멤버·Argo API는 변경하지 않는다.
          case "$SERVICE" in auth|reservation|stats|web) ;; *) exit 1 ;; esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HARBOR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$HARBOR_PULL_REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$HARBOR_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          # 오래 걸린 이전 CI가 최신 main의 이미지 버전을 되돌리지 않게 확인한다.
          source_is_current() {
            local latest
            latest=$(curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $SOURCE_GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha') || return 2
            [[ "$latest" == "$GITHUB_SHA" ]]
          }
          if source_is_current; then :; else
            status=$?
            if [[ "$status" == 1 ]]; then echo '더 새 main이 있어 갱신을 건너뜁니다.'; exit 0; fi
            exit "$status"
          fi
          FILE="releases/harbor/$SERVICE.yaml"
          test ! -L "$FILE"
          mkdir -p releases/harbor
          # JSON은 유효한 YAML 형식이다. 별도 편집 도구 설치 없이 jq로 값을 안전하게 기록한다.
          jq -n --arg service "$SERVICE" \
            --arg repository "$HARBOR_PULL_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME" \
            --arg tag "sha-$GITHUB_SHA@$HARBOR_DIGEST" \
            '{services:{($service):{image:{repository:$repository,tag:$tag}}}}' > "$FILE"
          git config user.name duckcloud-ci
          git config user.email duckcloud-ci@users.noreply.github.com
          git add -- "$FILE"
          if git diff --cached --quiet; then echo '이미 같은 버전입니다.'; exit 0; fi
          git commit -m "chore(images): $SERVICE sha-$GITHUB_SHA"
          # 다른 서비스가 먼저 수정했으면 받아서 재시도한다. 강제 push는 하지 않는다.
          for attempt in 1 2 3; do
            if source_is_current; then :; else
              status=$?
              if [[ "$status" == 1 ]]; then echo '더 새 main이 있어 push하지 않습니다.'; exit 0; fi
              exit "$status"
            fi
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep "$attempt"
          done
          echo '::error::GitOps push 실패. 브랜치 정책과 충돌을 확인하세요.'
          exit 1
