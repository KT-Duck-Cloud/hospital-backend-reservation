name: CI - reservation

# main은 최신 앱 코드로 검사한다. PR에는 배포 비밀번호나 쓰기 권한을 주지 않는다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=검사 / harbor-diagnose=인증 경로 진단 / harbor-login=로그인 / publish=업로드'
        type: choice
        options: [check, harbor-diagnose, harbor-login, publish]
        default: check

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SERVICE: reservation
  IMAGE_NAME: reservation-app-reservation
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY || 'cicd.ktci5.kr' }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT || 'duckcloud' }}
  # 저장된 관리자 계정과 섞이지 않게 임시 Runner 전용 로그인 경로를 사용한다.
  DOCKER_CONFIG: /tmp/duckcloud-docker-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  harbor-diagnose:
    # ci 브랜치에서도 빌드·Push 없이 인증 경로만 검사한다.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'harbor-diagnose' && (github.ref == 'refs/heads/ci' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harbor 인증 경로 진단 — 비밀정보 출력 없음
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # 본문에는 토큰이 포함될 수 있으므로 원문·쿠키·인증 헤더는 출력하지 않는다.
          set -euo pipefail
          set +x
          umask 077
          DIAG_DIR=$(mktemp -d "$RUNNER_TEMP/harbor-diagnose.XXXXXX")
          trap 'rm -rf "$DIAG_DIR"' EXIT
          [[ "$HARBOR_REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          BASE="https://$HARBOR_REGISTRY"
          echo "진단 시각(UTC): $(date -u +%FT%TZ)"
          echo "대상: $BASE / 실행 브랜치: $GITHUB_REF_NAME"
          
          show_result() {
            local label="$1" code="$2" prefix="$3"
            echo "===== $label / HTTP $code ====="
            # Cloudflare 담당자에게 전달할 요청 ID와 응답 종류만 출력한다.
            tr -d '\r' < "$prefix.headers" | grep -Ei '^(HTTP/|server:|content-type:|cf-ray:|cf-mitigated:|x-request-id:|docker-distribution-api-version:)' || true
            if grep -qi '^location:' "$prefix.headers"; then
              echo 'redirect_present=yes (자동 이동하지 않음)'
            fi
            if grep -qi '^set-cookie:' "$prefix.headers"; then
              echo 'set_cookie_present=yes (쿠키 값 숨김)'
            fi
            if jq -e 'type == "object"' "$prefix.body" >/dev/null 2>&1; then
              echo 'body_type=JSON'
              if jq -e '.errors[]? | select(.code == "UNAUTHORIZED")' "$prefix.body" >/dev/null 2>&1; then
                echo 'registry_error=UNAUTHORIZED'
              elif jq -e '.errors[]? | select(.code == "DENIED")' "$prefix.body" >/dev/null 2>&1; then
                echo 'registry_error=DENIED'
              fi
            elif grep -Eqi '<!doctype html|<html' "$prefix.body"; then
              echo 'body_type=HTML'
            else
              echo 'body_type=empty_or_other'
            fi
            if grep -Eqi 'cloudflare|cf-chl|challenge-platform|access denied' "$prefix.body"; then
              echo 'body_has_cloudflare_or_block_page_marker=yes (차단 주체 확정은 로그 확인 필요)'
            fi
          }
          
          request() {
            local label="$1" prefix="$2" url="$3"
            shift 3
            local code
            # 리다이렉트를 따라가며 다른 주소로 자격 증명을 보내지 않는다.
            if code=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
              --dump-header "$prefix.headers" --output "$prefix.body" \
              --write-out '%{http_code}' "$@" "$url"); then
              show_result "$label" "$code" "$prefix"
            else
              echo "===== $label / 네트워크 또는 TLS 연결 실패 ====="
              return 1
            fi
          }
          
          request 'Registry 인증 전' "$DIAG_DIR/registry" "$BASE/v2/" || exit 0
          REALM=$(tr -d '\r' < "$DIAG_DIR/registry.headers" | sed -n 's/^[Ww][Ww][Ww]-[Aa]uthenticate:.*realm="\([^"]*\)".*/\1/p' | tail -n 1)
          if [[ "$REALM" != "$BASE/service/token" ]]; then
            echo 'token_realm_matches_expected=no / 인증 정보를 전송하지 않고 중단'
            exit 0
          fi
          echo 'token_realm_matches_expected=yes / 외부 HTTPS 도메인의 /service/token'
          if [[ -z "$HARBOR_USERNAME" || -z "$HARBOR_PASSWORD" ]]; then
            echo 'credentials_present=no / GitHub Secrets 확인 필요'
            exit 0
          fi
          if [[ "$HARBOR_USERNAME" != 'robot$'* ]]; then
            echo 'robot_username_format=no / CI Robot 계정 이름 확인 필요'
            exit 0
          fi
          echo 'credentials_present=yes / robot_username_format=yes (실제 값은 숨김)'
          
          # 인증 정보는 권한 600인 임시 파일에만 넣고 실행 종료 시 삭제한다.
          BASIC_AUTH=$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 | tr -d '\r\n')
          printf 'header = "Authorization: Basic %s"\n' "$BASIC_AUTH" > "$DIAG_DIR/basic.conf"
          unset BASIC_AUTH
          request '로봇 계정 토큰 발급' "$DIAG_DIR/token" \
            "$BASE/service/token?service=harbor-registry" --config "$DIAG_DIR/basic.conf" || exit 0
          if ! ACCESS_TOKEN=$(jq -er '(.token // .access_token) | select(type == "string" and length > 0)' "$DIAG_DIR/token.body" 2>/dev/null); then
            echo 'token_issued=no / 위 상태 코드와 CF-Ray·X-Request-ID로 차단 로그 대조'
            exit 0
          fi
          echo 'token_issued=yes (토큰 값 숨김)'
          printf 'header = "Authorization: Bearer %s"\n' "$ACCESS_TOKEN" > "$DIAG_DIR/bearer.conf"
          unset ACCESS_TOKEN
          request '발급된 토큰으로 Registry 접근' "$DIAG_DIR/verified" \
            "$BASE/v2/" --config "$DIAG_DIR/bearer.conf" || exit 0
          echo '진단 종료: 이미지 업로드·배포는 실행하지 않았습니다. curl 진단이며 Docker 요청과 차이가 있을 수 있습니다.'

  harbor-login:
    # VM에서 성공한 접속과 GitHub Runner에서의 접속은 별도다. 첫 실행은 이 모드로 한다.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'harbor-login' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: CI Robot 계정으로 Harbor 로그인만 확인
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HARBOR_USERNAME" && test -n "$HARBOR_PASSWORD"
          [[ "$HARBOR_REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$HARBOR_USERNAME" == 'robot$'* ]] || { echo '::error::관리자가 아닌 CI Robot 계정을 지정하세요'; exit 1; }
          install -d -m 700 "$DOCKER_CONFIG"
          # Access 로그인 화면으로 이동하면 Docker 인증으로 통과한 것으로 보지 않는다.
          code=$(curl --connect-timeout 5 --max-time 20 -sS -D "$RUNNER_TEMP/registry-headers" -o "$RUNNER_TEMP/registry-response" -w '%{http_code}' "https://$HARBOR_REGISTRY/v2/")
          [[ "$code" == 401 || "$code" == 200 ]] || { echo "::error::Registry 응답 $code. Tunnel/Access/접속 경로를 확인하세요"; exit 1; }
          # 401은 비공개 Registry의 정상 인증 요구다. 토큰 발급 주소도 외부 HTTPS여야 한다.
          # VPN IP를 반환하면 GitHub 호스티드 Runner가 접속할 수 없으므로 여기서 중단한다.
          if [[ "$code" == 401 ]]; then
            challenge=$(tr -d '\r' < "$RUNNER_TEMP/registry-headers" | grep -i '^www-authenticate:' | tail -n 1)
            realm=$(printf '%s' "$challenge" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
            [[ "$realm" == "https://$HARBOR_REGISTRY/service/token" ]] || {
              echo '::error::Harbor 인증 토큰 주소가 외부 HTTPS 주소와 다릅니다. Tunnel/Harbor 설정을 확인하세요.'
              exit 1
            }
          fi
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin
          echo 'Harbor 로그인 성공. 이미지 업로드와 배포는 실행하지 않았습니다.' >> "$GITHUB_STEP_SUMMARY"
      - name: 시험 로그인 해제
        if: always()
        run: docker logout "$HARBOR_REGISTRY" || true

  check:
    if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'harbor-login' && inputs.mode != 'harbor-diagnose')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 이번 실행의 앱 소스 가져오기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.12 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 개발팀이 고정한 의존성 설치
        run: python -m pip install -r requirements-dev.txt
      - name: 문법 검사 및 SQLite 기반 테스트
        # TEST_DB_URL을 주입하지 않아 운영 DB 및 재시작 시험에 접속하지 않는다.
        run: |
          python -m compileall -q app shared tests
          python -m pytest tests -q --junitxml="$RUNNER_TEMP/pytest.xml"
      - name: 소스 취약점·비밀정보 검사
        # 결과 확인용 검사: 발견 사항이나 검사 오류로 빌드·배포를 중단하지 않는다.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Dockerfile 등 설정 검사
        # 결과 확인용 검사: 발견 사항이나 검사 오류로 빌드·배포를 중단하지 않는다.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: '0'
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
      # 업로드 작업이 꺼져 있을 때와 PR에서도 실제 이미지 빌드·검사는 수행한다.
      - name: 이미지 빌드 도구 준비
        if: github.event_name == 'pull_request' || vars.CICD_PUBLISH_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: 검사 전용 이미지 빌드
        if: github.event_name == 'pull_request' || vars.CICD_PUBLISH_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --load \
            --build-arg "APP_VERSION=$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "duckcloud/$IMAGE_NAME:latest" .
      - name: 실제 실행 이미지 검사
        if: github.event_name == 'pull_request' || vars.CICD_PUBLISH_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')
        # 결과 확인용 검사: 발견 사항이나 검사 오류로 빌드·배포를 중단하지 않는다.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: image
          image-ref: duckcloud/${{ env.IMAGE_NAME }}:latest
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CICD_PUBLISH_ENABLED == 'true' && (github.event_name == 'push' || inputs.mode == 'publish')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: 검사한 커밋의 앱 소스 가져오기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 업로드 설정 확인
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          test -n "$HARBOR_USERNAME" && test -n "$HARBOR_PASSWORD"
          [[ "$HARBOR_USERNAME" == 'robot$'* ]] || { echo '::error::CI Robot 계정을 사용하세요'; exit 1; }
          [[ "$HARBOR_REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$HARBOR_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
      - name: 이미지 빌드 도구 준비
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: 온프레미스·AWS x86 노드 공용 이미지 빌드
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --load \
            --build-arg "APP_VERSION=$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "duckcloud/$IMAGE_NAME:latest" .
      - name: 업로드할 실제 이미지 검사 — 참고용
        # 결과 확인용 검사: 발견 사항이나 검사 오류로 빌드·배포를 중단하지 않는다.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: image
          image-ref: duckcloud/${{ env.IMAGE_NAME }}:latest
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Harbor 인증 경로 진단 — 비밀정보 출력 없음
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # 본문에는 토큰이 포함될 수 있으므로 원문·쿠키·인증 헤더는 출력하지 않는다.
          set -euo pipefail
          set +x
          umask 077
          DIAG_DIR=$(mktemp -d "$RUNNER_TEMP/harbor-diagnose.XXXXXX")
          trap 'rm -rf "$DIAG_DIR"' EXIT
          [[ "$HARBOR_REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          BASE="https://$HARBOR_REGISTRY"
          echo "진단 시각(UTC): $(date -u +%FT%TZ)"
          echo "대상: $BASE / 실행 브랜치: $GITHUB_REF_NAME"
          
          show_result() {
            local label="$1" code="$2" prefix="$3"
            echo "===== $label / HTTP $code ====="
            # Cloudflare 담당자에게 전달할 요청 ID와 응답 종류만 출력한다.
            tr -d '\r' < "$prefix.headers" | grep -Ei '^(HTTP/|server:|content-type:|cf-ray:|cf-mitigated:|x-request-id:|docker-distribution-api-version:)' || true
            if grep -qi '^location:' "$prefix.headers"; then
              echo 'redirect_present=yes (자동 이동하지 않음)'
            fi
            if grep -qi '^set-cookie:' "$prefix.headers"; then
              echo 'set_cookie_present=yes (쿠키 값 숨김)'
            fi
            if jq -e 'type == "object"' "$prefix.body" >/dev/null 2>&1; then
              echo 'body_type=JSON'
              if jq -e '.errors[]? | select(.code == "UNAUTHORIZED")' "$prefix.body" >/dev/null 2>&1; then
                echo 'registry_error=UNAUTHORIZED'
              elif jq -e '.errors[]? | select(.code == "DENIED")' "$prefix.body" >/dev/null 2>&1; then
                echo 'registry_error=DENIED'
              fi
            elif grep -Eqi '<!doctype html|<html' "$prefix.body"; then
              echo 'body_type=HTML'
            else
              echo 'body_type=empty_or_other'
            fi
            if grep -Eqi 'cloudflare|cf-chl|challenge-platform|access denied' "$prefix.body"; then
              echo 'body_has_cloudflare_or_block_page_marker=yes (차단 주체 확정은 로그 확인 필요)'
            fi
          }
          
          request() {
            local label="$1" prefix="$2" url="$3"
            shift 3
            local code
            # 리다이렉트를 따라가며 다른 주소로 자격 증명을 보내지 않는다.
            if code=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
              --dump-header "$prefix.headers" --output "$prefix.body" \
              --write-out '%{http_code}' "$@" "$url"); then
              show_result "$label" "$code" "$prefix"
            else
              echo "===== $label / 네트워크 또는 TLS 연결 실패 ====="
              return 1
            fi
          }
          
          request 'Registry 인증 전' "$DIAG_DIR/registry" "$BASE/v2/" || exit 0
          REALM=$(tr -d '\r' < "$DIAG_DIR/registry.headers" | sed -n 's/^[Ww][Ww][Ww]-[Aa]uthenticate:.*realm="\([^"]*\)".*/\1/p' | tail -n 1)
          if [[ "$REALM" != "$BASE/service/token" ]]; then
            echo 'token_realm_matches_expected=no / 인증 정보를 전송하지 않고 중단'
            exit 0
          fi
          echo 'token_realm_matches_expected=yes / 외부 HTTPS 도메인의 /service/token'
          if [[ -z "$HARBOR_USERNAME" || -z "$HARBOR_PASSWORD" ]]; then
            echo 'credentials_present=no / GitHub Secrets 확인 필요'
            exit 0
          fi
          if [[ "$HARBOR_USERNAME" != 'robot$'* ]]; then
            echo 'robot_username_format=no / CI Robot 계정 이름 확인 필요'
            exit 0
          fi
          echo 'credentials_present=yes / robot_username_format=yes (실제 값은 숨김)'
          
          # 인증 정보는 권한 600인 임시 파일에만 넣고 실행 종료 시 삭제한다.
          BASIC_AUTH=$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 | tr -d '\r\n')
          printf 'header = "Authorization: Basic %s"\n' "$BASIC_AUTH" > "$DIAG_DIR/basic.conf"
          unset BASIC_AUTH
          request '로봇 계정 토큰 발급' "$DIAG_DIR/token" \
            "$BASE/service/token?service=harbor-registry" --config "$DIAG_DIR/basic.conf" || exit 0
          if ! ACCESS_TOKEN=$(jq -er '(.token // .access_token) | select(type == "string" and length > 0)' "$DIAG_DIR/token.body" 2>/dev/null); then
            echo 'token_issued=no / 위 상태 코드와 CF-Ray·X-Request-ID로 차단 로그 대조'
            exit 0
          fi
          echo 'token_issued=yes (토큰 값 숨김)'
          printf 'header = "Authorization: Bearer %s"\n' "$ACCESS_TOKEN" > "$DIAG_DIR/bearer.conf"
          unset ACCESS_TOKEN
          request '발급된 토큰으로 Registry 접근' "$DIAG_DIR/verified" \
            "$BASE/v2/" --config "$DIAG_DIR/bearer.conf" || exit 0
          echo '진단 종료: 이미지 업로드·배포는 실행하지 않았습니다. curl 진단이며 Docker 요청과 차이가 있을 수 있습니다.'
      - name: Harbor CI 계정 로그인
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin
      - name: Harbor latest 태그 업로드
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 느린 이전 실행이나 과거 커밋 재실행이 latest를 예전 코드로 바꾸지 않도록 확인한다.
          CURRENT_MAIN=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer $SOURCE_GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -er '.object.sha')
          if [[ "$CURRENT_MAIN" != "$GITHUB_SHA" ]]; then
            echo '더 새로운 main이 있어 이번 latest 업로드를 건너뜁니다.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          LOCAL="duckcloud/$IMAGE_NAME:latest"
          TARGET="$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:latest"
          # latest는 최신 main 이미지로 갱신하는 태그다. 기존 태그 유무와 관계없이 push한다.
          docker tag "$LOCAL" "$TARGET"
          docker push "$TARGET"
          echo "Harbor 업로드 완료: $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "원본 커밋: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Registry 로그인 해제
        if: always()
        run: |
          docker logout "$HARBOR_REGISTRY" || true
